<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e2">
<title>The Score Lodge — Daylight</title>
<style>
  :root{
    --paper:#f7f1e2;        /* sun-bright warm white */
    --paper-2:#efe6cf;
    --ink:#181008;          /* near-black text */
    --ink-soft:#4a3d2c;
    --line:#181008;
    --ember:#d95f13;        /* hunter orange */
    --ember-dark:#b34a08;
    --pine:#2e5426;         /* forest green */
    --pine-dark:#1f3d19;
    --card:#141009;         /* flip card face */
    --card-2:#241c10;
    --gold:#ffcf33;
    --red:#d63d17;
    --blue:#1b62c2;
    --serif:Georgia,"Times New Roman",serif;
    --digits:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}

  body{
    font-family:var(--serif);
    color:var(--ink);
    background:var(--paper);
    min-height:100vh;
    padding:10px 12px calc(28px + env(safe-area-inset-bottom));
    padding-left:calc(12px + env(safe-area-inset-left));
    padding-right:calc(12px + env(safe-area-inset-right));
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }
  button{touch-action:manipulation;user-select:none;-webkit-user-select:none;}

  .lodge{max-width:560px;margin:0 auto;}

  /* ============ header ============ */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 14px;margin-bottom:12px;
    background:var(--ink);color:var(--paper);
    border-radius:12px;border:3px solid var(--ink);
  }
  header .title{
    font-size:19px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    display:flex;align-items:center;gap:9px;line-height:1.1;
  }
  header .title svg{width:34px;height:22px;flex:none;}
  header .session{
    font-family:var(--digits);font-size:14px;font-weight:700;letter-spacing:.04em;
    background:var(--ember);color:#fff;padding:7px 12px;border-radius:8px;
    white-space:nowrap;
  }

  /* ============ archer tabs ============ */
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
  .tab{
    font-family:var(--serif);
    border:3px solid var(--ink);border-radius:12px;
    background:#fff;color:var(--ink);
    padding:10px 4px 8px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    min-height:72px;
    transition:transform .08s;
  }
  .tab:active{transform:scale(.96);}
  .tab .t-name{
    font-size:15px;font-weight:700;line-height:1.15;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    padding:0 4px;
  }
  .tab .t-score{
    font-family:var(--digits);font-size:24px;font-weight:800;
    font-variant-numeric:tabular-nums;line-height:1.1;
  }
  .tab .t-sub{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.75;}
  .tab.active{
    background:var(--pine);color:#fff;border-color:var(--pine-dark);
    box-shadow:0 3px 0 var(--pine-dark);
  }

  /* ============ active panel ============ */
  .panel{
    background:#fff;border:3px solid var(--ink);border-radius:14px;
    padding:14px 12px 16px;margin-bottom:12px;
    box-shadow:0 4px 0 rgba(24,16,8,.25);
  }
  .panel-head{
    display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;
  }
  .panel-head h2{font-size:24px;font-weight:700;}
  .rename{
    background:var(--paper-2);border:2px solid var(--ink);border-radius:9px;
    font-size:16px;line-height:1;padding:8px 11px;cursor:pointer;color:var(--ink);
  }
  .rename:active{transform:scale(.94);}

  .label{
    text-align:center;font-size:12px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;
  }

  /* ============ flip counters ============ */
  .flip-counter{display:flex;justify-content:center;gap:6px;}
  .flip-counter.big{--dw:64px;--dh:92px;--dfs:62px;margin-bottom:14px;}
  .flip-counter.small{--dw:36px;--dh:52px;--dfs:34px;margin-bottom:4px;}

  .flip-digit{
    position:relative;width:var(--dw);height:var(--dh);
    font-family:var(--digits);font-weight:800;font-size:var(--dfs);
    font-variant-numeric:tabular-nums;
    perspective:380px;border-radius:9px;background:#000;
    box-shadow:0 3px 0 rgba(24,16,8,.35);
  }
  .flip-digit::after{
    content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;
    background:var(--paper);opacity:.9;z-index:10;
  }
  .fd-half{
    position:absolute;left:0;width:100%;height:50%;overflow:hidden;color:#fff;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
  }
  .fd-half .fd-num{
    position:absolute;left:0;width:100%;height:var(--dh);
    line-height:var(--dh);text-align:center;
  }
  .fd-top{top:0;border-radius:9px 9px 0 0;background:linear-gradient(180deg,var(--card-2),var(--card));}
  .fd-top .fd-num{top:0;}
  .fd-bottom{bottom:0;border-radius:0 0 9px 9px;background:linear-gradient(180deg,var(--card),#000);}
  .fd-bottom .fd-num{top:-100%;}

  .fd-flip-top,.fd-flip-bottom{z-index:5;}
  .fd-flip-top{
    top:0;border-radius:9px 9px 0 0;
    background:linear-gradient(180deg,var(--card-2),var(--card));
    transform-origin:center bottom;
    animation:fdTop .30s ease-in forwards;
  }
  .fd-flip-top .fd-num{top:0;}
  .fd-flip-top::before{
    content:"";position:absolute;inset:0;background:rgba(0,0,0,0);
    animation:fdShadeTop .30s ease-in forwards;
  }
  .fd-flip-bottom{
    bottom:0;border-radius:0 0 9px 9px;
    background:linear-gradient(180deg,var(--card),#000);
    transform-origin:center top;transform:rotateX(90deg);
    animation:fdBottom .34s cubic-bezier(.34,1.45,.62,1) .28s forwards;
  }
  .fd-flip-bottom .fd-num{top:-100%;}
  .fd-flip-bottom::before{
    content:"";position:absolute;inset:0;background:rgba(255,255,255,.30);
    animation:fdShadeBottom .34s ease-out .28s forwards;
  }
  @keyframes fdTop{to{transform:rotateX(-90deg);}}
  @keyframes fdBottom{to{transform:rotateX(0deg);}}
  @keyframes fdShadeTop{to{background:rgba(0,0,0,.6);}}
  @keyframes fdShadeBottom{from{background:rgba(255,255,255,.30);}to{background:rgba(255,255,255,0);}}

  .flip-digit.bump{animation:fdBump .36s ease;}
  @keyframes fdBump{35%{transform:translateY(2px) scale(.985);}70%{transform:translateY(-1px);}}

  .meta-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:12px;
  }
  .arrow-count{font-size:15px;font-weight:700;color:var(--ink-soft);}
  .undo{
    font-family:var(--serif);font-size:16px;font-weight:700;
    background:#fff;border:3px solid var(--ink);color:var(--ink);
    border-radius:10px;padding:12px 18px;cursor:pointer;min-height:52px;
  }
  .undo:active{transform:scale(.95);}
  .undo:disabled{opacity:.3;}

  /* ============ score pad ============ */
  .quiver{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px;
  }
  .arrow-btn{
    font-family:var(--digits);font-size:30px;font-weight:800;
    min-height:72px;border-radius:12px;cursor:pointer;
    border:3px solid var(--ink);
    box-shadow:0 4px 0 rgba(24,16,8,.4);
    transition:transform .07s, box-shadow .07s;
  }
  .arrow-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(24,16,8,.4);}
  /* real target-face ring colours, sun-proof contrast */
  .arrow-btn.gold {background:var(--gold);color:var(--ink);}
  .arrow-btn.red  {background:var(--red);color:#fff;}
  .arrow-btn.blue {background:var(--blue);color:#fff;}
  .arrow-btn.black{background:var(--ink);color:#fff;}
  .arrow-btn.white{background:#fff;color:var(--ink);}
  .arrow-btn.miss {background:#8b8375;color:#fff;font-size:24px;}

  /* ============ controls ============ */
  .controls{display:grid;grid-template-columns:1fr;gap:10px;margin:4px 0 16px;}
  .big-btn{
    font-family:var(--serif);font-size:20px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;cursor:pointer;
    min-height:64px;border-radius:12px;
    background:var(--ember);color:#fff;
    border:3px solid var(--ember-dark);
    box-shadow:0 4px 0 var(--ember-dark);
  }
  .big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ember-dark);}
  .big-btn.ghost{
    background:#fff;color:var(--ink);border-color:var(--ink);
    box-shadow:0 3px 0 rgba(24,16,8,.3);
    font-size:15px;min-height:50px;font-weight:700;
  }

  /* ============ log book ============ */
  .logbook{
    background:#fff;border:3px solid var(--ink);border-radius:14px;
    padding:14px 12px;box-shadow:0 4px 0 rgba(24,16,8,.25);
  }
  .logbook h3{
    text-align:center;font-size:13px;letter-spacing:.26em;text-transform:uppercase;
    font-weight:700;margin-bottom:10px;
  }
  .logbook table{width:100%;border-collapse:collapse;font-size:16px;}
  .logbook th{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
    text-align:left;padding:6px 6px;border-bottom:2px solid var(--ink);font-weight:700;
  }
  .logbook th.num,.logbook td.num{text-align:right;font-family:var(--digits);font-variant-numeric:tabular-nums;font-weight:700;}
  .logbook td{padding:9px 6px;border-bottom:1px solid rgba(24,16,8,.2);}
  .logbook td.date{font-size:13px;color:var(--ink-soft);}
  .logbook tr.total-row td{
    border-bottom:none;border-top:3px solid var(--ink);
    color:var(--ember-dark);font-weight:800;padding-top:11px;font-size:17px;
  }
  .logbook .best{color:var(--ember-dark);}
  .empty-log{text-align:center;color:var(--ink-soft);font-style:italic;padding:8px 0 4px;font-size:15px;}

  footer{
    text-align:center;margin-top:16px;font-size:12px;font-weight:700;
    letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;
  }

  @keyframes logFlash{from{background:rgba(217,95,19,.3);}to{background:transparent;}}
  tr.fresh td{animation:logFlash 1.6s ease-out;}

  /* small phones / large font settings */
  @media (max-width:400px){
    .flip-counter.big{--dw:56px;--dh:82px;--dfs:54px;}
    header .title{font-size:16px;}
  }
  /* roomy layout on tablets/desktop */
  @media (min-width:700px){
    .lodge{max-width:640px;}
    .controls{grid-template-columns:2fr 1fr;}
  }
</style>
</head>
<body>
<div class="lodge">

  <header>
    <div class="title">
      <svg viewBox="0 0 120 34" fill="none" stroke="#f7f1e2" stroke-width="5" stroke-linecap="round">
        <path d="M60 30 C60 18 52 14 44 12 M48 15 C46 9 47 5 50 2 M44 12 C36 12 30 8 28 2 M38 13 C33 17 26 17 20 14"/>
        <path d="M60 30 C60 18 68 14 76 12 M72 15 C74 9 73 5 70 2 M76 12 C84 12 90 8 92 2 M82 13 C87 17 94 17 100 14"/>
      </svg>
      <span>Score Lodge<br><span style="font-size:11px;letter-spacing:.28em;opacity:.8;">Daylight</span></span>
    </div>
    <div class="session" id="sessionBanner">Session 1</div>
  </header>

  <nav class="tabs" id="tabs"><!-- archer tabs injected --></nav>

  <section class="panel" id="panel"><!-- active archer injected --></section>

  <div class="controls">
    <button class="big-btn" id="finishBtn">&#128293; Finish Session</button>
    <button class="big-btn ghost" id="resetBtn">Burn the Logbook</button>
  </div>

  <section class="logbook">
    <h3>&#127794; Lodge Logbook &#127794;</h3>
    <div id="logbookBody"></div>
  </section>

  <footer>Scores save on this device automatically</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---- same storage key as the cabin version: totals carry over ---- */
  var KEY = "score-lodge-v1";
  var TAB_KEY = "score-lodge-active";
  var state = load();
  var active = clampTab(parseInt(localStorage.getItem(TAB_KEY), 10));

  function clampTab(v){ return (v===1||v===2) ? v : 0; }
  function defaultState(){
    return { names:["Hunter 1","Hunter 2","Hunter 3"], current:[[],[],[]], history:[] };
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return defaultState();
      var s = JSON.parse(raw);
      if(!s || !Array.isArray(s.names) || s.names.length!==3) return defaultState();
      if(!Array.isArray(s.current) || s.current.length!==3) s.current=[[],[],[]];
      if(!Array.isArray(s.history)) s.history=[];
      return s;
    }catch(e){ return defaultState(); }
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      localStorage.setItem(TAB_KEY, String(active));
    }catch(e){}
  }

  function sum(arr){ var t=0; for(var i=0;i<arr.length;i++) t+=arr[i]; return t; }
  function sessionScore(i){ return sum(state.current[i]); }
  function historyTotal(i){
    var t=0;
    for(var h=0;h<state.history.length;h++) t+=state.history[h].scores[i];
    return t;
  }
  function rollingTotal(i){ return historyTotal(i)+sessionScore(i); }

  /* ---------------- flip digits ---------------- */
  function FlipDigit(parent){
    this.el = document.createElement("div");
    this.el.className = "flip-digit";
    this.el.innerHTML =
      '<div class="fd-half fd-top"><div class="fd-num">0</div></div>'+
      '<div class="fd-half fd-bottom"><div class="fd-num">0</div></div>';
    this.top = this.el.children[0].firstChild;
    this.bottom = this.el.children[1].firstChild;
    this.value = "0";
    this._temps = [];
    parent.appendChild(this.el);
  }
  FlipDigit.prototype.set = function(v, animate){
    v = String(v);
    if(v === this.value) return;
    var old = this.value;
    this.value = v;
    if(!animate){
      this.top.textContent = v;
      this.bottom.textContent = v;
      return;
    }
    for(var i=0;i<this._temps.length;i++){
      if(this._temps[i].parentNode) this._temps[i].parentNode.removeChild(this._temps[i]);
    }
    this._temps.length = 0;

    var flipTop = document.createElement("div");
    flipTop.className = "fd-half fd-flip-top";
    flipTop.innerHTML = '<div class="fd-num">'+old+'</div>';
    var flipBottom = document.createElement("div");
    flipBottom.className = "fd-half fd-flip-bottom";
    flipBottom.innerHTML = '<div class="fd-num">'+v+'</div>';

    this.top.textContent = v;
    this.el.appendChild(flipTop);
    this.el.appendChild(flipBottom);
    this._temps.push(flipTop, flipBottom);

    var self = this;
    flipBottom.addEventListener("animationend", function done(){
      flipBottom.removeEventListener("animationend", done);
      self.bottom.textContent = self.value;
      if(flipTop.parentNode) flipTop.parentNode.removeChild(flipTop);
      if(flipBottom.parentNode) flipBottom.parentNode.removeChild(flipBottom);
      var k = self._temps.indexOf(flipTop); if(k>-1) self._temps.splice(k,1);
      k = self._temps.indexOf(flipBottom); if(k>-1) self._temps.splice(k,1);
    });

    this.el.classList.remove("bump");
    void this.el.offsetWidth;
    this.el.classList.add("bump");
  };

  function FlipCounter(parent, digits, cssClass){
    this.el = document.createElement("div");
    this.el.className = "flip-counter "+cssClass;
    this.digits = [];
    for(var i=0;i<digits;i++) this.digits.push(new FlipDigit(this.el));
    parent.appendChild(this.el);
  }
  FlipCounter.prototype.set = function(value, animate){
    var str = String(Math.max(0, Math.floor(value)));
    while(str.length > this.digits.length){
      var d = new FlipDigit(this.el);
      this.el.insertBefore(d.el, this.el.firstChild);
      this.digits.unshift(d);
    }
    while(str.length < this.digits.length) str = "0"+str;
    for(var i=0;i<str.length;i++){
      var ch = str.charAt(i);
      var digit = this.digits[i];
      if(digit.value !== ch){
        (function(dg, c, delay, anim){
          if(anim && delay>0) setTimeout(function(){ dg.set(c, true); }, delay);
          else dg.set(c, anim);
        })(digit, ch, (str.length-1-i)*50, animate);
      }
    }
  };

  /* ---------------- archer tabs ---------------- */
  var tabsEl = document.getElementById("tabs");
  var tabRefs = [];
  for(var t=0;t<3;t++){
    (function(idx){
      var b = document.createElement("button");
      b.className = "tab";
      b.innerHTML =
        '<span class="t-name"></span>'+
        '<span class="t-score">0</span>'+
        '<span class="t-sub">total</span>';
      b.addEventListener("click", function(){
        if(active !== idx){
          active = idx;
          save();
          buildPanel(false);
          refreshTabs();
        }
      });
      tabsEl.appendChild(b);
      tabRefs.push(b);
    })(t);
  }
  function refreshTabs(){
    for(var i=0;i<3;i++){
      var b = tabRefs[i];
      b.classList.toggle("active", i===active);
      b.querySelector(".t-name").textContent = state.names[i];
      b.querySelector(".t-score").textContent = rollingTotal(i);
    }
  }

  /* ---------------- active panel ---------------- */
  var ARROWS = [
    {label:"X",  val:10, cls:"gold"},
    {label:"10", val:10, cls:"gold"},
    {label:"9",  val:9,  cls:"gold"},
    {label:"8",  val:8,  cls:"red"},
    {label:"7",  val:7,  cls:"red"},
    {label:"6",  val:6,  cls:"blue"},
    {label:"5",  val:5,  cls:"blue"},
    {label:"4",  val:4,  cls:"black"},
    {label:"3",  val:3,  cls:"black"},
    {label:"2",  val:2,  cls:"white"},
    {label:"1",  val:1,  cls:"white"},
    {label:"Miss", val:0, cls:"miss"}
  ];

  var panelEl = document.getElementById("panel");
  var ui = null; // {big, small, arrowCount, undo, nameEl}

  function buildPanel(animate){
    panelEl.innerHTML = "";
    var idx = active;

    var head = document.createElement("div");
    head.className = "panel-head";
    var h2 = document.createElement("h2");
    h2.textContent = state.names[idx];
    var renameBtn = document.createElement("button");
    renameBtn.className = "rename";
    renameBtn.title = "Rename archer";
    renameBtn.innerHTML = "&#9998;";
    renameBtn.addEventListener("click", function(){
      var n = prompt("New name:", state.names[idx]);
      if(n && n.trim()){
        state.names[idx] = n.trim().slice(0,20);
        h2.textContent = state.names[idx];
        save(); refreshTabs(); renderLog();
      }
    });
    head.appendChild(h2);
    head.appendChild(renameBtn);
    panelEl.appendChild(head);

    var lbl1 = document.createElement("div");
    lbl1.className = "label";
    lbl1.textContent = "This Session";
    panelEl.appendChild(lbl1);
    var big = new FlipCounter(panelEl, 3, "big");

    var quiver = document.createElement("div");
    quiver.className = "quiver";
    ARROWS.forEach(function(ar){
      var b = document.createElement("button");
      b.className = "arrow-btn "+ar.cls;
      b.textContent = ar.label;
      b.addEventListener("click", function(){
        state.current[idx].push(ar.val);
        save();
        refreshPanel(true);
        refreshTabs();
      });
      quiver.appendChild(b);
    });
    panelEl.appendChild(quiver);

    var lbl2 = document.createElement("div");
    lbl2.className = "label";
    lbl2.innerHTML = "Rolling Total &mdash; All Hunts";
    panelEl.appendChild(lbl2);
    var small = new FlipCounter(panelEl, 4, "small");

    var meta = document.createElement("div");
    meta.className = "meta-row";
    var arrowCount = document.createElement("span");
    arrowCount.className = "arrow-count";
    var undo = document.createElement("button");
    undo.className = "undo";
    undo.innerHTML = "&#8617; Undo";
    undo.addEventListener("click", function(){
      if(state.current[idx].length){
        state.current[idx].pop();
        save();
        refreshPanel(true);
        refreshTabs();
      }
    });
    meta.appendChild(arrowCount);
    meta.appendChild(undo);
    panelEl.appendChild(meta);

    ui = {big:big, small:small, arrowCount:arrowCount, undo:undo};
    refreshPanel(animate);
  }

  function refreshPanel(animate){
    var idx = active;
    ui.big.set(sessionScore(idx), animate);
    ui.small.set(rollingTotal(idx), animate);
    var n = state.current[idx].length;
    ui.arrowCount.textContent = n+" arrow"+(n===1?"":"s")+" loosed";
    ui.undo.disabled = n===0;
  }

  /* ---------------- banner + logbook ---------------- */
  var banner = document.getElementById("sessionBanner");
  function renderBanner(){
    banner.textContent = "Session "+(state.history.length+1);
  }

  var logBody = document.getElementById("logbookBody");
  function renderLog(freshIndex){
    if(!state.history.length){
      logBody.innerHTML = '<div class="empty-log">No hunts yet. Finish a session to carve it in.</div>';
      return;
    }
    var html = '<table><thead><tr><th>#</th><th>Date</th>';
    for(var i=0;i<3;i++) html += '<th class="num">'+esc(shortName(state.names[i]))+'</th>';
    html += '</tr></thead><tbody>';
    for(var h=state.history.length-1; h>=0; h--){
      var s = state.history[h];
      var best = Math.max(s.scores[0], s.scores[1], s.scores[2]);
      html += '<tr'+(h===freshIndex?' class="fresh"':'')+'><td>'+(h+1)+'</td><td class="date">'+esc(s.date)+'</td>';
      for(var j=0;j<3;j++){
        var cls = (s.scores[j]===best && best>0) ? "num best" : "num";
        html += '<td class="'+cls+'">'+s.scores[j]+'</td>';
      }
      html += '</tr>';
    }
    html += '<tr class="total-row"><td colspan="2">Total</td>';
    for(var k=0;k<3;k++) html += '<td class="num">'+historyTotal(k)+'</td>';
    html += '</tr></tbody></table>';
    logBody.innerHTML = html;
  }
  function shortName(n){ return n.length>9 ? n.slice(0,8)+"…" : n; }
  function esc(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  /* ---------------- controls ---------------- */
  document.getElementById("finishBtn").addEventListener("click", function(){
    var any = state.current[0].length || state.current[1].length || state.current[2].length;
    if(!any){ alert("No arrows loosed yet — nothing to log."); return; }
    var d = new Date();
    state.history.push({
      date: d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) +
            " " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}),
      scores:[sessionScore(0), sessionScore(1), sessionScore(2)]
    });
    state.current = [[],[],[]];
    save();
    refreshPanel(true);
    refreshTabs();
    renderBanner();
    renderLog(state.history.length-1);
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(confirm("Burn the logbook? All sessions, totals and names go up in smoke.")){
      state = defaultState();
      active = 0;
      save();
      location.reload();
    }
  });

  /* ---------------- first paint ---------------- */
  buildPanel(false);
  refreshTabs();
  renderBanner();
  renderLog();
})();
</script>
</body>
</html>
