<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Start &amp; Settings — 3D Icons</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#06080f; touch-action:none;
    font-family:"Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#dfe6f2; user-select:none; }
  #view { position:fixed; inset:0; display:block; touch-action:none; }
  #hud { position:fixed; left:0; right:0; bottom:0; z-index:5; display:flex; align-items:flex-end;
    justify-content:space-between; padding:14px calc(env(safe-area-inset-right,0px) + 16px)
    calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 16px);
    pointer-events:none; }
  #hud > * { pointer-events:auto; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; opacity:.85; }
  h1 small { display:block; font-size:11px; font-weight:400; letter-spacing:.04em; text-transform:none; opacity:.6; margin-top:4px; }
  .btns { display:flex; gap:8px; }
  button { background:rgba(20,28,44,.75); border:1px solid rgba(120,160,220,.35); color:#dfe6f2;
    border-radius:999px; padding:9px 14px; font-size:13px; cursor:pointer; backdrop-filter:blur(8px); }
  button.on { background:rgba(70,140,255,.35); border-color:rgba(120,190,255,.8); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; z-index:9; background:#06080f;
    font-size:13px; letter-spacing:.2em; text-transform:uppercase; opacity:.7; transition:opacity .6s; }
  #loading.gone { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">Loading</div>
<div id="hud">
  <h1>Start &amp; Settings<small>Drag to orbit · pinch or scroll to zoom</small></h1>
  <div class="btns">
    <button id="bAuto" class="on">Auto orbit</button>
    <button id="bBloom" class="on">Bloom</button>
    <button id="bPause">Pause</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x06080f, 70, 160);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
camera.position.set(0, 16, 62);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.6;
controls.minDistance = 30; controls.maxDistance = 120;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 4, 0);

// image-based lighting from a procedural studio room
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ---------------------------------------------------------------- background
// A large inverted sphere carrying an animated fbm "nebula" shader.
const bgMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec3 vDir;
    void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    precision highp float;
    varying vec3 vDir; uniform float uTime;
    vec3 hash3(vec3 p){ p = vec3(dot(p,vec3(127.1,311.7,74.7)), dot(p,vec3(269.5,183.3,246.1)), dot(p,vec3(113.5,271.9,124.6)));
      return -1.0 + 2.0*fract(sin(p)*43758.5453123); }
    float noise(vec3 p){ vec3 i = floor(p), f = fract(p); vec3 u = f*f*(3.0-2.0*f);
      return mix(mix(mix(dot(hash3(i+vec3(0,0,0)),f-vec3(0,0,0)), dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),
                     mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)), dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                 mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)), dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),
                     mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)), dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z); }
    float fbm(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<5;i++){ s += a*noise(p); p = p*2.02 + 11.3; a *= 0.5; } return s; }
    void main(){
      vec3 d = normalize(vDir);
      float t = uTime*0.03;
      float n = fbm(d*2.2 + vec3(t, -t*0.7, t*0.4));
      float n2 = fbm(d*5.0 - vec3(t*0.5, t, 0.0));
      vec3 deep = vec3(0.020,0.028,0.060);
      vec3 blue = vec3(0.05,0.22,0.55);
      vec3 mag  = vec3(0.45,0.10,0.50);
      vec3 col = deep;
      col = mix(col, blue, smoothstep(0.05,0.55,n+0.25)*0.55);
      col = mix(col, mag,  smoothstep(0.15,0.6,n2+0.2)*0.35*smoothstep(-0.2,0.6,d.y+0.3));
      col *= 1.0 - 0.55*smoothstep(-0.05,-0.7,d.y);           // darker floor horizon
      float stars = pow(max(0.0, noise(d*140.0)), 18.0)*3.0 * smoothstep(0.0,0.3,d.y);
      col += stars;
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(180, 48, 32), bgMat));

// ---------------------------------------------------------------- lights
scene.add(new THREE.HemisphereLight(0x8fb4ff, 0x1a0f2a, 0.35));

const key = new THREE.DirectionalLight(0xfff2e0, 1.5);
key.position.set(26, 40, 28);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -40;
key.shadow.camera.right = key.shadow.camera.top = 40;
key.shadow.camera.near = 5; key.shadow.camera.far = 140;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03; key.shadow.radius = 4;
scene.add(key);

// two coloured rim lights that orbit the scene
const rimA = new THREE.PointLight(0x37b6ff, 520, 120, 1.6);
const rimB = new THREE.PointLight(0xff4fd8, 420, 120, 1.6);
scene.add(rimA, rimB);
const bulbGeo = new THREE.SphereGeometry(0.55, 16, 16);
rimA.add(new THREE.Mesh(bulbGeo, new THREE.MeshBasicMaterial({ color: 0x8fdfff })));
rimB.add(new THREE.Mesh(bulbGeo, new THREE.MeshBasicMaterial({ color: 0xffa6ee })));

// ---------------------------------------------------------------- shader helper
// Injects an animated fresnel rim glow into any MeshPhysicalMaterial.
function addRim(mat, color, strength) {
  mat.userData.rim = { value: new THREE.Color(color) };
  mat.userData.rimStrength = { value: strength };
  mat.userData.time = { value: 0 };
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uRim = mat.userData.rim;
    sh.uniforms.uRimStrength = mat.userData.rimStrength;
    sh.uniforms.uTime = mat.userData.time;
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform vec3 uRim; uniform float uRimStrength; uniform float uTime;`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        {
          vec3 V = normalize(vViewPosition);
          float f = pow(1.0 - clamp(dot(V, normal), 0.0, 1.0), 3.2);
          float pulse = 0.75 + 0.25*sin(uTime*1.7);
          totalEmissiveRadiance += uRim * f * uRimStrength * pulse;
        }`);
  };
  return mat;
}

// ---------------------------------------------------------------- start icon (four panes)
const startGroup = new THREE.Group();
startGroup.position.set(-13, 6, 0);
scene.add(startGroup);

const paneMat = addRim(new THREE.MeshPhysicalMaterial({
  color: 0x0f5fd6, metalness: 0.2, roughness: 0.3,
  clearcoat: 1.0, clearcoatRoughness: 0.08,
  sheen: 0.4, sheenColor: new THREE.Color(0x9fd4ff), sheenRoughness: 0.5,
  envMapIntensity: 0.9,
}), 0x66ccff, 1.0);

const paneGeo = new RoundedBoxGeometry(8, 8, 3, 5, 1.25);
const panes = [];
for (const [ix, iy] of [[-1, 1], [1, 1], [-1, -1], [1, -1]]) {
  const m = new THREE.Mesh(paneGeo, paneMat);
  m.castShadow = m.receiveShadow = true;
  m.userData.base = new THREE.Vector3(ix * 5, iy * 5, 0);
  m.position.copy(m.userData.base);
  startGroup.add(m); panes.push(m);
}

// ---------------------------------------------------------------- settings icon (gear)
function gearShape(teeth, ro, ri, hub) {
  const s = new THREE.Shape();
  const halfT = THREE.MathUtils.degToRad(11), halfB = Math.PI / teeth;
  let first = true;
  for (let i = 0; i < teeth; i++) {
    const a = (2 * Math.PI * i) / teeth;
    for (const [ang, r] of [[a - halfB, ri], [a - halfT, ro], [a + halfT, ro], [a + halfB, ri]]) {
      const x = r * Math.cos(ang), y = r * Math.sin(ang);
      first ? s.moveTo(x, y) : s.lineTo(x, y); first = false;
    }
  }
  s.closePath();
  const hole = new THREE.Path();
  hole.absarc(0, 0, hub, 0, Math.PI * 2, true);
  s.holes.push(hole);
  return s;
}
const gearGeo = new THREE.ExtrudeGeometry(gearShape(8, 10.6, 8.0, 4.8), {
  depth: 3, bevelEnabled: true, bevelThickness: 0.55, bevelSize: 0.5, bevelSegments: 6, curveSegments: 48,
});
gearGeo.center();
gearGeo.computeVertexNormals();

const gearMat = addRim(new THREE.MeshPhysicalMaterial({
  color: 0xb9bfcc, metalness: 1.0, roughness: 0.36,
  clearcoat: 0.6, clearcoatRoughness: 0.2,
  iridescence: 0.9, iridescenceIOR: 1.6, iridescenceThicknessRange: [120, 480],
  envMapIntensity: 0.85,
}), 0xff7ae6, 0.7);

const gearGroup = new THREE.Group();
gearGroup.position.set(13, 6, 0);
scene.add(gearGroup);
const gear = new THREE.Mesh(gearGeo, gearMat);
gear.castShadow = gear.receiveShadow = true;
gearGroup.add(gear);

// small satellite gear meshing behind the main one
const gear2 = new THREE.Mesh(
  new THREE.ExtrudeGeometry(gearShape(8, 5.3, 4.0, 1.6), { depth: 2, bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.3, bevelSegments: 4, curveSegments: 32 }),
  addRim(new THREE.MeshPhysicalMaterial({ color: 0x6d7a90, metalness: 1, roughness: 0.35, clearcoat: 0.4, envMapIntensity: 1.2 }), 0x66ccff, 0.8)
);
gear2.geometry.center();
gear2.castShadow = gear2.receiveShadow = true;
gear2.position.set(13.2, 8.6, -2.6);
gearGroup.add(gear2);

// ---------------------------------------------------------------- floor
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(90, 96),
  new THREE.MeshPhysicalMaterial({ color: 0x0b0f1a, metalness: 0.7, roughness: 0.33, envMapIntensity: 0.9 })
);
floor.rotation.x = -Math.PI / 2; floor.position.y = -6.5; floor.receiveShadow = true;
scene.add(floor);

// glowing rings under each icon
const ringMat = new THREE.MeshBasicMaterial({ color: 0x3aa8ff, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false });
for (const x of [-13, 13]) {
  const r = new THREE.Mesh(new THREE.RingGeometry(11.5, 12, 96), ringMat);
  r.rotation.x = -Math.PI / 2; r.position.set(x, -6.45, 0); scene.add(r);
}

// floating dust motes
const N = 420, pos = new Float32Array(N * 3);
for (let i = 0; i < N; i++) { pos[i*3] = (Math.random()-0.5)*90; pos[i*3+1] = Math.random()*40-6; pos[i*3+2] = (Math.random()-0.5)*70; }
const dust = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(pos, 3)),
  new THREE.PointsMaterial({ color: 0x9fd4ff, size: 0.18, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true }));
scene.add(dust);

// ---------------------------------------------------------------- post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.42, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------- UI
let paused = false;
const bAuto = document.getElementById('bAuto'), bBloom = document.getElementById('bBloom'), bPause = document.getElementById('bPause');
bAuto.onclick = () => { controls.autoRotate = !controls.autoRotate; bAuto.classList.toggle('on', controls.autoRotate); };
bBloom.onclick = () => { bloom.enabled = !bloom.enabled; bBloom.classList.toggle('on', bloom.enabled); };
bPause.onclick = () => { paused = !paused; bPause.textContent = paused ? 'Play' : 'Pause'; bPause.classList.toggle('on', paused); };

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- animation
const clock = new THREE.Clock();
let t = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) t += dt;

  bgMat.uniforms.uTime.value = t;
  for (const m of [paneMat, gearMat, gear2.material]) m.userData.time.value = t;

  // start icon: whole block turns, panes breathe apart and ripple in depth
  startGroup.rotation.y = t * 0.55;
  startGroup.rotation.x = Math.sin(t * 0.6) * 0.18;
  startGroup.position.y = 6 + Math.sin(t * 1.1) * 0.8;
  const spread = 1 + 0.18 * (0.5 + 0.5 * Math.sin(t * 0.9));
  panes.forEach((p, i) => {
    p.position.x = p.userData.base.x * spread;
    p.position.y = p.userData.base.y * spread;
    p.position.z = Math.sin(t * 2.0 + i * 1.57) * 1.4;
    p.rotation.z = Math.sin(t * 1.3 + i) * 0.06;
  });

  // gear: spins on its axis, meshed satellite counter-rotates, whole thing slowly yaws
  gear.rotation.z = -t * 0.8;
  gear2.rotation.z = t * 0.8 * (8 / 8) * (10.6 / 5.3) + Math.PI / 8;
  gearGroup.rotation.y = Math.sin(t * 0.35) * 0.9;
  gearGroup.rotation.x = Math.sin(t * 0.5) * 0.15;
  gearGroup.position.y = 6 + Math.cos(t * 1.1) * 0.8;

  // orbiting rim lights
  rimA.position.set(Math.cos(t * 0.7) * 34, 10 + Math.sin(t * 0.9) * 8, Math.sin(t * 0.7) * 34);
  rimB.position.set(Math.cos(t * 0.7 + Math.PI) * 30, 14 + Math.cos(t * 1.1) * 6, Math.sin(t * 0.7 + Math.PI) * 30);

  dust.rotation.y = t * 0.02;
  controls.update();
  composer.render();
}
frame();
document.getElementById('loading').classList.add('gone');
</script>
</body>
</html>
