<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Start">
  <title>Start</title>
  <!--
    Four-pane "window" start glyph.
    Deliberately flat (no perspective tilt), rounded panes and an open gap
    so it reads as a generic window/grid icon rather than any vendor mark.
    Uses currentColor so it inherits the surrounding text/icon color.
  -->
  <g fill="currentColor">
    <rect x="3"    y="3"    width="8" height="8" rx="1.25"/>
    <rect x="13"   y="3"    width="8" height="8" rx="1.25"/>
    <rect x="3"    y="13"   width="8" height="8" rx="1.25"/>
    <rect x="13"   y="13"   width="8" height="8" rx="1.25"/>
  </g>
</svg>
